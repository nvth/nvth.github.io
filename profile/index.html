  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #FFDE00; /* Vibrant Yellow */
      --panel-bg: #FFFFFF;
      --border: #000000;
      --cyan: #00E5FF;
      --magenta: #FF007F;
      --lime: #39FF14;
      --purple: #9D00FF;
      --red: #FF3333;
      --text: #000000;
      --muted: #444444;
      
      --font-body: 'Comic Neue', cursive, sans-serif;
      --font-heading: 'Bangers', cursive, sans-serif;
      
      --shadow-hard: 6px 6px 0px #000000;
      --shadow-hard-hover: 10px 10px 0px #000000;
    }

    html { scroll-behavior: smooth; }
    
    body { 
      background-color: var(--bg-color);
      /* Halftone dot pattern */
      background-image: radial-gradient(var(--border) 10%, transparent 11%);
      background-size: 20px 20px;
      color: var(--text); 
      font-family: var(--font-body); 
      line-height: 1.5; 
      min-height: 100vh; 
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 12px; border-left: 3px solid #000; }
    ::-webkit-scrollbar-track { background: var(--panel-bg); }
    ::-webkit-scrollbar-thumb { background: var(--magenta); border: 3px solid #000; }

    /* ── HEADER ── */
    header {
      text-align: center;
      padding: 80px 20px 60px;
      position: relative;
    }
    
    /* Starburst behind title */
    .starburst {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 400px; height: 400px;
      background: var(--cyan);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      z-index: -1;
      border: 4px solid #000;
      animation: spin 30s linear infinite;
    }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    .avatar-comic {
      display: inline-block;
      font-size: 4rem;
      background: var(--panel-bg);
      border: 4px solid var(--border);
      border-radius: 50%;
      padding: 10px;
      box-shadow: var(--shadow-hard);
      margin-bottom: 20px;
      transform: rotate(-5deg);
    }

    header h1 {
      font-family: var(--font-heading); 
      font-size: clamp(4rem, 10vw, 7rem); 
      color: var(--panel-bg); 
      letter-spacing: 4px;
      -webkit-text-stroke: 3px #000;
      text-shadow: 6px 6px 0px var(--magenta); 
      margin-bottom: 10px;
      transform: rotate(-2deg);
    }
    
    .subtitle { 
      font-weight: bold; 
      font-size: 1.5rem; 
      background: #000; 
      color: var(--bg-color); 
      display: inline-block; 
      padding: 6px 16px; 
      transform: rotate(2deg);
      border: 3px solid var(--panel-bg);
      box-shadow: 4px 4px 0px var(--red);
      margin-bottom: 24px;
    }
    
    .badge-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 10px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; 
      background: var(--panel-bg);
      font-weight: 700; font-size: 1.1rem;
      border: 3px solid #000; 
      box-shadow: 4px 4px 0px #000;
      transform: rotate(random(-3deg, 3deg));
      transition: transform .2s, box-shadow .2s;
    }
    .badge:hover { transform: translateY(-4px) scale(1.05); box-shadow: 6px 6px 0px #000; }
    .badge-green { background: var(--lime); }
    .badge-blue  { background: var(--cyan); }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--panel-bg);
      border-bottom: 4px solid var(--border);
      display: flex; justify-content: center; gap: 10px; padding: 12px 20px; flex-wrap: wrap;
      box-shadow: 0 4px 0px #000;
    }
    nav a {
      color: var(--text); text-decoration: none; font-size: 1.1rem; font-weight: bold;
      padding: 6px 16px; border: 2px solid #000; background: var(--bg-color);
      box-shadow: 3px 3px 0px #000; transition: all .1s;
    }
    nav a:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000; background: var(--magenta); color: #fff; }
    nav a:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }

    /* ── MAIN ── */
    main { max-width: 900px; margin: 0 auto; padding: 60px 24px; }
    
    .comic-panel {
      background: var(--panel-bg);
      border: 4px solid var(--border);
      box-shadow: var(--shadow-hard);
      padding: 30px;
      margin-bottom: 60px;
      position: relative;
    }
    /* Add random subtle tilts to panels */
    #about { transform: rotate(1deg); }
    #certs { transform: rotate(-1deg); }
    #tools { transform: rotate(-0.5deg); }
    #stats { transform: rotate(1deg); }
    #focus { transform: rotate(-1deg); background: transparent; border: none; box-shadow: none; padding: 0;}
    #timeline { transform: rotate(0deg); }
    
    .section-title {
      font-family: var(--font-heading);
      font-size: 3rem; 
      color: #000;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      display: inline-block;
      text-shadow: 3px 3px 0px var(--cyan);
      position: relative;
      z-index: 2;
    }
    .section-title::after {
      content: '';
      position: absolute;
      left: -10px; bottom: 5px; right: -10px; height: 15px;
      background: var(--yellow); z-index: -1;
      border: 2px solid #000;
    }

    /* ── CODE / TEXT ── */
    .comic-text { font-size: 1.15rem; font-weight: bold; }
    .highlight { background: var(--lime); padding: 0 4px; border: 2px solid #000; }
    
    blockquote {
      border: 3px solid #000; padding: 20px; margin-top: 20px;
      background: var(--cyan); 
      font-size: 1.2rem; font-weight: bold;
      box-shadow: 6px 6px 0px #000;
    }

    /* ── CERT CARDS ── */
    .cert-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 24px; }
    .cert-card {
      background: var(--bg-color); border: 4px solid var(--border);
      padding: 20px; display: flex; align-items: center; gap: 16px;
      box-shadow: var(--shadow-hard); transition: transform .2s;
    }
    .cert-card:hover { transform: scale(1.03) rotate(-2deg); box-shadow: var(--shadow-hard-hover); }
    .cert-icon { font-size: 3rem; text-shadow: 2px 2px 0px #000; }
    .cert-name { font-family: var(--font-heading); font-size: 2rem; letter-spacing: 1px; line-height: 1; }
    .cert-full { font-weight: bold; font-size: 1.1rem; }
    .cert-meta { font-size: 1rem; font-weight: bold; padding: 4px 8px; border: 2px solid #000; display: inline-block; margin-top: 8px; background: #fff; }

    /* ── TAGS ── */
    .tag-group { margin-bottom: 24px; }
    .tag-label { font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 12px; letter-spacing: 1px; color: var(--magenta); text-shadow: 2px 2px 0px #000; -webkit-text-stroke: 1px #000;}
    .tags { display: flex; flex-wrap: wrap; gap: 12px; }
    .tag {
      padding: 8px 16px;
      font-family: var(--font-heading); font-size: 1.3rem; letter-spacing: 1px;
      border: 3px solid #000; box-shadow: 3px 3px 0px #000;
      color: #000; transition: transform .1s;
    }
    .tag:hover { transform: scale(1.1) rotate(3deg); }
    .tag-off  { background: var(--red); color: #fff;}
    .tag-def  { background: var(--lime); }
    .tag-tool { background: var(--cyan); }
    .tag-lang { background: var(--bg-color); }
    .tag-plat { background: var(--purple); color: #fff; }

    /* ── STAT CARDS ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 20px; }
    .stat-card {
      background: var(--panel-bg); border: 4px solid var(--border);
      padding: 24px 10px; text-align: center;
      box-shadow: var(--shadow-hard);
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: -10px; right: -10px; width: 40px; height: 40px;
      background: var(--magenta); border: 3px solid #000; border-radius: 50%;
    }
    .stat-num { font-family: var(--font-heading); font-size: 4rem; color: var(--red); line-height: 1; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0px #000; }
    .stat-label { font-size: 1.1rem; font-weight: bold; margin-top: 10px; }

    /* ── TIMELINE ── */
    .timeline { position: relative; padding-left: 30px; margin-top: 20px;}
    .timeline::before {
      content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 6px;
      background: #000; border-right: 2px solid #fff;
    }
    .tl-item { position: relative; margin-bottom: 40px; background: var(--cyan); padding: 16px; border: 3px solid #000; box-shadow: 4px 4px 0px #000;}
    .tl-dot {
      position: absolute; left: -36px; top: 12px;
      width: 24px; height: 24px; background: var(--yellow); border: 4px solid #000;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); /* Star shape */
    }
    .tl-date  { font-family: var(--font-heading); font-size: 1.5rem; color: var(--panel-bg); -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0px #000; background: var(--magenta); display: inline-block; padding: 2px 8px; border: 2px solid #000; position: absolute; top: -20px; right: 10px; transform: rotate(3deg);}
    .tl-title { font-family: var(--font-heading); font-size: 1.5rem; letter-spacing: 1px;}
    .tl-desc  { font-size: 1.1rem; font-weight: bold; margin-top: 6px; }

    /* ── FOCUS (SPEECH BUBBLE) ── */
    .speech-bubble {
      background: #fff; border: 4px solid #000; border-radius: 30px;
      padding: 30px; position: relative; box-shadow: var(--shadow-hard);
      margin-bottom: 60px;
    }
    .speech-bubble::after, .speech-bubble::before {
      content: ''; position: absolute; border-style: solid;
    }
    .speech-bubble::after { /* Outer border tail */
      bottom: -34px; left: 60px;
      border-width: 30px 20px 0;
      border-color: #000 transparent transparent transparent;
    }
    .speech-bubble::before { /* Inner white tail */
      bottom: -24px; left: 63px;
      border-width: 24px 14px 0;
      border-color: #fff transparent transparent transparent;
      z-index: 1;
    }
    .sb-title { font-family: var(--font-heading); font-size: 2rem; color: var(--magenta); -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0px #000; margin-bottom: 16px;}
    .sb-list { list-style: none; font-size: 1.2rem; font-weight: bold; line-height: 1.8;}
    .sb-list li::before { content: '💥'; margin-right: 10px; }

    /* ── CONNECT ── */
    .connect-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;
      max-width: 760px; margin: 0 auto;
    }
    .connect-card {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 16px; background: var(--lime);
      border: 4px solid var(--border); box-shadow: 4px 4px 0px #000;
      text-decoration: none; color: #000; font-family: var(--font-heading); font-size: 1.5rem; letter-spacing: 1px;
      transition: all .2s;
    }
    .connect-card:hover { transform: translate(-2px, -2px) scale(1.05); box-shadow: 8px 8px 0px #000; background: var(--cyan); }
    .connect-card svg { width: 28px; height: 28px; }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 40px 20px;
      border-top: 6px dashed var(--border); background: var(--panel-bg);
      font-weight: bold; font-size: 1.2rem;
    }
    footer .quote { font-family: var(--font-heading); font-size: 1.8rem; color: var(--red); margin-bottom: 10px; text-shadow: 2px 2px 0px #000; -webkit-text-stroke: 1px #000;}

    @media (max-width: 768px) {
      header { padding: 40px 16px 30px; }
      header h1 { font-size: 3rem; -webkit-text-stroke: 2px #000; }
      .starburst { width: 250px; height: 250px; }
      .avatar-comic { font-size: 3rem; }
      nav { padding: 10px; gap: 6px; }
      nav a { font-size: 0.9rem; padding: 6px 10px; }
      main { padding: 30px 16px; }
      .comic-panel { padding: 20px 16px; margin-bottom: 40px; }
      .section-title { font-size: 2.2rem; }
      .cert-grid { grid-template-columns: 1fr; }
      .connect-grid { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .timeline { padding-left: 24px; margin-top: 30px; }
      .tl-dot { left: -30px; width: 20px; height: 20px; }
      .tl-date { font-size: 1.2rem; top: -18px; }
      .tl-title { font-size: 1.3rem; }
      .tl-item { padding: 12px; margin-bottom: 30px; }
      .speech-bubble { padding: 20px 16px; border-radius: 16px; margin-bottom: 40px; }
      .speech-bubble::after { left: 30px; bottom: -24px; border-width: 24px 16px 0; }
      .speech-bubble::before { left: 33px; bottom: -16px; border-width: 16px 10px 0; }
      .sb-title { font-size: 1.6rem; }
      .tag-label { font-size: 1.5rem; }
      .tag { font-size: 1.1rem; padding: 6px 12px; }
    }
  </style>
</head>
